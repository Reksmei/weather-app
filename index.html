<!DOCTYPE html>
<html lang="en">
<head>
  <link href="styles.css" rel="stylesheet" />
  <title>Weather App</title>
  <meta charset="UTF-8">
</head>
<body>
  <main>
    <section id="weather-wrapper">
      <h1>Weather App</h1>
      <p>Select a country and city below to get the current weather</p><br>
      <div id="weather-search">
        <select id="country-selection" name="Country Selection">
          <option value="48">Poland</option>
          <option value="61">Australia</option>
          <option value="49">Germany</option>       
          <option value="91">India</option>
          <option value="1">United States</option>
          <option value="44">United Kingdom</option>
          <option value="33">France</option>
          <option value="81">Japan</option>
          <option value="86">China</option>
          <option value="55">Brazil</option>
        </select>
        <input id="search" type="text" placeholder="Search by city" />
        <input id="submit" type="submit" onclick="fetchWeather()" value="Search" />
      </div>
      <div id="weather-data" style="display: none;"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
